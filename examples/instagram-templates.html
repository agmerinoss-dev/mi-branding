<meta charset="utf-8">
<title>Venturest — plantillas de Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@1,300&display=swap" rel="stylesheet">

<style>
/* ── Tokens (espejo de tokens/tokens.css) ───────────────────────── */
:root{
  --vt-black:#0C1014; --vt-gray:#4C4C4C; --vt-violet:#8B6FB0; --vt-white:#FFF;
  --vt-white-64:rgba(255,255,255,.64); --vt-white-40:rgba(255,255,255,.40);
  --vt-white-12:rgba(255,255,255,.12); --vt-white-06:rgba(255,255,255,.06);
  --vt-font-display:"Geist",system-ui,sans-serif;
  --vt-font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --vt-font-accent:"Instrument Sans",serif;
  --vt-margin:72px; --vt-hairline:1.5px; --vt-hud-arm:88px;
}

/* ── Superficie de previsualización (no forma parte de la marca) ── */
body{margin:0;background:#151515;color:#888;font-family:var(--vt-font-mono);padding:40px}
.lab{display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start}
.slot{width:340px}
.slot > figcaption{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;color:#7a7a7a}
.stage{width:340px;overflow:hidden}
.stage > .piece{transform-origin:top left;transform:scale(.3148)} /* 340/1080 */

/* ── Piezas ─────────────────────────────────────────────────────── */
.piece{background:var(--vt-black);color:var(--vt-white);position:relative;overflow:hidden;
       font-family:var(--vt-font-display);font-weight:400;box-sizing:border-box}
.piece--portrait{width:1080px;height:1350px}
.piece--square{width:1080px;height:1080px}
.piece--story{width:1080px;height:1920px}

.eyebrow{font-family:var(--vt-font-mono);font-weight:500;font-size:22px;
         letter-spacing:.12em;text-transform:uppercase;color:var(--vt-white-64)}
.headline{font-size:72px;line-height:1.05;letter-spacing:-.02em;font-weight:400;margin:0}
.display{font-size:96px;line-height:1.02;letter-spacing:-.02em;font-weight:400;margin:0}
.support{font-size:32px;line-height:1.4;color:var(--vt-gray);margin:0;max-width:820px}
.accent{color:var(--vt-violet)}
.italic{font-family:var(--vt-font-accent);font-style:italic;font-weight:300}

.wordmark{font-size:26px;letter-spacing:.04em;color:var(--vt-white-64)}
.wordmark sup{font-size:.5em;vertical-align:super}

.coords{font-family:var(--vt-font-mono);font-size:18px;letter-spacing:.12em;
        text-transform:uppercase;color:var(--vt-white-40)}

/* Marco HUD: solo dos esquinas */
.hud{position:absolute;width:var(--vt-hud-arm);height:var(--vt-hud-arm);pointer-events:none}
.hud--tl{top:var(--vt-margin);left:var(--vt-margin);
         border-top:var(--vt-hairline) solid var(--vt-white-40);
         border-left:var(--vt-hairline) solid var(--vt-white-40)}
.hud--br{bottom:var(--vt-margin);right:var(--vt-margin);
         border-bottom:var(--vt-hairline) solid var(--vt-white-40);
         border-right:var(--vt-hairline) solid var(--vt-white-40)}

/* Glow violeta: anclado a un borde, nunca detrás del titular */
.glow{position:absolute;width:820px;height:820px;pointer-events:none;
      background:radial-gradient(circle at center,
        rgba(139,111,176,.34) 0%, rgba(139,111,176,.14) 42%, rgba(139,111,176,0) 72%)}
.glow--br{right:-320px;bottom:-300px}
.glow--tr{right:-340px;top:-280px}

/* Grid blueprint: solo posters de evento */
.blueprint{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--vt-white-06) var(--vt-hairline),transparent var(--vt-hairline)),
                   linear-gradient(90deg,var(--vt-white-06) var(--vt-hairline),transparent var(--vt-hairline));
  background-size:60px 60px}

.pad{position:absolute;inset:var(--vt-margin);display:flex;flex-direction:column}
.push{margin-top:auto}
.rule{height:var(--vt-hairline);background:var(--vt-white-12);width:100%}

/* Story: zonas seguras de la UI de Instagram */
.story-pad{position:absolute;left:var(--vt-margin);right:var(--vt-margin);
           top:240px;bottom:320px;display:flex;flex-direction:column}

/* Foto real de fondo. Sustituir el color por la imagen del equipo. */
.photo{position:absolute;inset:0;background:#1b1b1f center/cover no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:rgba(12,16,20,.58)}
.photo-note{position:absolute;top:50%;left:0;right:0;text-align:center;
            font-family:var(--vt-font-mono);font-size:20px;letter-spacing:.12em;
            color:var(--vt-white-40);text-transform:uppercase}

.cta{display:inline-block;background:var(--vt-white);color:var(--vt-black);
     font-size:32px;letter-spacing:-.01em;padding:28px 44px;align-self:flex-start}

.dot{width:14px;height:14px;background:var(--vt-violet);display:inline-block;
     margin-right:18px;vertical-align:middle}

.counter{font-family:var(--vt-font-mono);font-size:22px;letter-spacing:.12em;color:var(--vt-white-40)}
.figure{font-size:140px;line-height:1;letter-spacing:-.03em;font-weight:400}
</style>

<div class="lab">

  <!-- 1. POST STATEMENT ─ posicionamiento, feed 4:5 -->
  <figure class="slot">
    <figcaption>01 · post statement · 1080×1350</figcaption>
    <div class="stage" style="height:425px">
      <div class="piece piece--portrait">
        <div class="glow glow--br"></div>
        <div class="hud hud--tl"></div>
        <div class="pad">
          <p class="eyebrow">[PARTNER PROGRAM]</p>
          <div class="push"></div>
          <h1 class="headline">No llevas una idea a tus clientes.<br>Llevas un <span class="accent">producto</span>.</h1>
          <p class="support" style="margin-top:48px;color:var(--vt-white-64)">
            Soluciones de IA ya empaquetadas, con proveedor validado detrás.
            Tú pones la cartera y tu margen.
          </p>
          <div class="rule" style="margin:64px 0 32px"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="wordmark">VENTUREST<sup>®</sup></span>
            <span class="coords">39°28'N 0°22'W · [VALENCIA]</span>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <!-- 2. POST DE CIFRA ─ prueba social, feed 1:1 -->
  <figure class="slot">
    <figcaption>02 · post de cifra · 1080×1080</figcaption>
    <div class="stage" style="height:340px">
      <div class="piece piece--square">
        <div class="hud hud--br"></div>
        <div class="pad">
          <p class="eyebrow">[TRACK RECORD]</p>
          <div class="push"></div>
          <p class="figure">€3M+</p>
          <p class="support" style="margin-top:32px;color:var(--vt-white-64)">
            en oportunidades generadas para la red. +2.000 proyectos analizados,
            100+ clientes activos.
          </p>
          <p class="wordmark" style="margin:64px 0 0">VENTUREST<sup>®</sup></p>
        </div>
      </div>
    </div>
  </figure>

  <!-- 3. STORY CTA ─ venta diaria sobre foto real -->
  <figure class="slot">
    <figcaption>03 · story CTA · 1080×1920</figcaption>
    <div class="stage" style="height:605px">
      <div class="piece piece--story">
        <div class="photo"><span class="photo-note">[ FOTO REAL DE EQUIPO O EVENTO ]</span></div>
        <div class="story-pad">
          <p class="eyebrow">[VIERNES · CIERRE]</p>
          <h2 class="headline" style="margin-top:32px">
            Tu cartera ya te pide IA.<br>Todavía no tienes qué venderles.
          </h2>
          <p class="support" style="margin-top:40px;color:var(--vt-white-64)">
            Te damos el catálogo, el proveedor y el soporte técnico.
            Tú facturas con tu margen — nosotros nunca lo vemos.
          </p>
          <div class="push"></div>
          <span class="cta">Escríbenos por DM</span>
          <p class="coords" style="margin-top:56px"><span class="dot"></span>39°28'N 0°22'W · [VALENCIA]</p>
        </div>
      </div>
    </div>
  </figure>

  <!-- 4. SLIDE DE CARRUSEL ─ explicar el modelo -->
  <figure class="slot">
    <figcaption>04 · slide de carrusel · 1080×1350</figcaption>
    <div class="stage" style="height:425px">
      <div class="piece piece--portrait">
        <div class="hud hud--tl"></div>
        <div class="pad">
          <div style="display:flex;justify-content:space-between">
            <span class="eyebrow">[CÓMO FUNCIONA]</span>
            <span class="counter">02 / 05</span>
          </div>
          <div class="push"></div>
          <h2 class="display">Sin negociaciones largas.</h2>
          <p class="support" style="margin-top:48px;color:var(--vt-white-64)">
            Creas el proyecto, la plataforma hace el matching de proveedores
            y abre la licitación. Seleccionas, firmas y arrancas.
          </p>
          <div class="push"></div>
          <p class="wordmark">VENTUREST<sup>®</sup></p>
        </div>
      </div>
    </div>
  </figure>

  <!-- 5. POSTER DE EVENTO ─ único caso con grid blueprint -->
  <figure class="slot">
    <figcaption>05 · poster de evento · 1080×1350</figcaption>
    <div class="stage" style="height:425px">
      <div class="piece piece--portrait">
        <div class="blueprint"></div>
        <div class="glow glow--tr"></div>
        <div class="pad">
          <p class="eyebrow">[ED_01 DIGITAL TRENDS]</p>
          <div class="push"></div>
          <h2 class="display">Adopción de IA<br><span class="italic">en el mundo real</span></h2>
          <p class="support" style="margin-top:40px;color:var(--vt-white-64)">
            Encuentro para agencias y consultoras. Plazas por invitación.
          </p>
          <div class="rule" style="margin:56px 0 28px"></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="coords">39°28'N 0°22'W · [VALENCIA] · OCTOBER</span>
            <span class="wordmark">VENTUREST<sup>®</sup></span>
          </div>
        </div>
      </div>
    </div>
  </figure>

</div>
